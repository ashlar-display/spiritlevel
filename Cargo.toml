[package]
name = "spiritlevel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TMDS link bring-up for HDMI sources: clock ratio, scrambling and sink configuration"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/spiritlevel"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "tmds", "scrambling"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]
include = ["src/**", "doc/**", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["display-types"]
culvert = ["dep:culvert"]

[dependencies]
display-types = { version = "0.5", default-features = false, optional = true }
hdmi-hal = { version = "0.6", default-features = false }
culvert = { version = "0.3", default-features = false, optional = true }

# Prototype against hdmi-hal's unreleased breaking release (release order step 2): pushed
# commits of hdmi-hal's feat/tmds-phy branch and of culvert's feat/tmds-config, which
# builds on it (the `culvert` feature), moved by hand. Removed when they are released.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "35131adfe65067620e004665f6e2a88a4dbd6fb9" }
culvert = { git = "https://github.com/ashlar-display/culvert", rev = "5e77b83c73e091919f597dedae4388c8a7f3052b" }
