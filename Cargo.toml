[package]
name = "spiritlevel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TMDS link bring-up for HDMI sources: clock ratio, scrambling and sink configuration"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/spiritlevel"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "tmds", "scrambling"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]
include = ["src/**", "doc/**", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["display-types"]
culvert = ["dep:culvert"]

[dependencies]
display-types = { version = "0.5", default-features = false, optional = true }
hdmi-hal = { version = "0.7", default-features = false }
culvert = { version = "0.3", default-features = false, optional = true }

# Prototype against culvert's unreleased breaking release (the `culvert` feature): a pushed
# commit of its feat/tmds-config branch, on hdmi-hal 0.7, moved by hand. Removed when it is
# released.
[patch.crates-io]
culvert = { git = "https://github.com/ashlar-display/culvert", rev = "acab6379a04b6feb9e6740e4ef143dba4906de06" }
